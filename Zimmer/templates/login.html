{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Zimmer</title>

    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
<div class="profile-page">

    <header class="profile-header">
        <img src="{% static 'img/img.png' %}" alt="Zimmer" class="profile-logo">

        <h1 class="profile-title">Login</h1>
        <p class="profile-subtitle">Enter your account credentials</p>
    </header>

    <div class="profile-view-card">
        <form method="post" class="login-form">
            {% csrf_token %}

            <section class="form-section">
                <h2 class="section-title">Account Login</h2>

                <div class="login-fields">
                    <div class="field">
                        <label for="email">Email <span class="required-mark">*</span></label>
                        <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                value="{{ request.POST.email|default:'' }}"
                                required
                        >
                    </div>

                    <div class="field">
                        <label for="password">Password <span class="required-mark">*</span></label>
                        <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter password"
                                required
                        >
                    </div>
                </div>

                <div id="validationMessageLogin"
                     class="validation-message validation-message-section"
                     role="alert"
                     {% if not error %}hidden{% endif %}>
                    {% if error %}{{ error }}{% endif %}
                </div>
            </section>

            <div class="form-actions">
                <button type="submit" class="btn-submit btn-login">
                    Login
                </button>
            </div>
        </form>
    </div>

</div>
</body>
</html>
